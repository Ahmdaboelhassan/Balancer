<a
  [routerLink]="['/Period', 'PeriodJournals', item?.id]"
  class="block p-5 bg-white border border-gray-200 rounded-lg shadow hover:bg-gray-100"
>
  <h4 class="mb-2 text-lg lg:text-2xl font-bold tracking-tight text-gray-900">
    <a [routerLink]="['/Period', 'Edit', item?.id]">
      <i
        class="fa-regular fa-calendar me-2"
        [ngClass]="item?.increasedBalance ? 'text-green-500' : 'text-red-500'"
      ></i>
      {{ item?.name }}
    </a>
    @if (item?.isCurrent) {
      <span
        class="ms-2 align-middle inline-flex items-center gap-1 rounded-full bg-green-100 px-2.5 py-0.5 text-xs lg:text-sm font-medium text-green-700"
      >
        <i class="fa-solid fa-circle-check"></i>
        Current
      </span>
    }
  </h4>
  <h6
    class="text-md lg:text-xl font-bold tracking-tight text-gray-500 flex items-center gap-2"
  >
    <i class="fa-regular fa-clock text-gray-400"></i>

    <span>{{ item?.from }}</span>

    <i class="fa-solid fa-arrow-right text-gray-400"></i>

    <span>{{ item?.to }}</span>
  </h6>

  <div class="p-1 flex justify-end items-end">
    @if (item?.periodBudget) {
      <span class="flex items-center gap-2 flex-wrap">
        <!-- Budget -->
        <span
          class="inline-flex items-center gap-1.5 rounded-full bg-blue-100 px-3 py-1 text-xs lg:text-lg font-medium text-blue-700"
          title="Budget"
        >
          <i class="fa-solid fa-wallet"></i>
          {{ item?.periodBudget }}
        </span>

        <!-- Spent -->
        <span
          class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs lg:text-lg font-medium"
          title="Spent"
          [ngClass]="
            item?.totalAmount >= 0
              ? 'bg-green-100 text-green-700'
              : 'bg-red-100 text-red-700'
          "
        >
          <i class="fa-solid fa-coins"></i>
          {{ item?.totalAmount }}
        </span>

        <!-- Remaining -->
        <span
          class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs lg:text-lg font-medium"
          title="Remaining"
          [ngClass]="
            item?.remains >= 0
              ? 'bg-green-100 text-green-700'
              : 'bg-red-100 text-red-700'
          "
        >
          <i class="fa-solid fa-chart-line"></i>
          {{ item?.remains }}
        </span>
      </span>
    } @else {
      <span class="flex items-center">
        @if (item?.increasedBalance) {
          <span class="text-green-500 text-3xl font-bold me-2">
            {{ item?.totalAmount }}
          </span>
          <i class="fa-solid fa-square-plus text-green-500 text-3xl"></i>
        } @else {
          <span class="text-red-500 text-3xl font-bold me-2">
            {{ item?.totalAmount }}
          </span>
          <i class="fa-solid fa-square-minus text-red-500 text-3xl"></i>
        }
      </span>
    }
  </div>
</a>
